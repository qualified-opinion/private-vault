name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, test, permission gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Runner images ship an Android SDK but may lag the compileSdk in use.
      - name: Install Android platform 37 and build-tools 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Lint, detekt, unit tests, release + debug builds
        run: ./gradlew lint detekt testDebugUnitTest assembleRelease assembleDebug --console=plain

      - name: Permission gate (no INTERNET / network libs)
        run: scripts/check-permissions.sh

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: private-vault-apks
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
          if-no-files-found: ignore

      # Proves the gate: inject INTERNET into the manifest, rebuild, and require the gate to FAIL.
      # Runs after the APK upload so the shipped artifact is never the canary build.
      - name: Canary - permission gate must fail with INTERNET
        run: scripts/canary-internet.sh

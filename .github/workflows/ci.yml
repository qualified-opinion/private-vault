name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual run, e.g. before a merge: largeTests runs the crypto streaming test at 3 GiB instead of 256 MiB.
  workflow_dispatch:
    inputs:
      largeTests:
        description: "Run the 3 GiB crypto streaming test (-PlargeTests)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, test, permission gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Runner images ship an Android SDK but may lag the compileSdk in use.
      - name: Install Android platform 37 and build-tools 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Lint, detekt, unit tests, release + debug builds
        run: >-
          ./gradlew lint detekt testDebugUnitTest assembleRelease assembleDebug
          :core:crypto:assembleDebugAndroidTest --console=plain
          ${{ inputs.largeTests && '-PlargeTests' || '' }}

      - name: Permission gate (no INTERNET / network libs)
        run: scripts/check-permissions.sh

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: private-vault-apks
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
          if-no-files-found: ignore

      # Proves the gate: inject INTERNET into the manifest, rebuild, and require the gate to FAIL.
      # Runs after the APK upload so the shipped artifact is never the canary build.
      - name: Canary - permission gate must fail with INTERNET
        run: scripts/canary-internet.sh

  instrumented:
    name: SAF, Keystore and minified unlock tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android platform 37 and build-tools 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      # https://github.com/ReactiveCircus/android-emulator-runner#running-hardware-accelerated-emulators-on-linux-runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests (exclude the phone-only 1 GiB SAF benchmark)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: >-
            timeout 20m ./gradlew
            :core:crypto:connectedDebugAndroidTest
            :core:vault:connectedDebugAndroidTest
            :app:connectedReleaseCheckAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notClass=com.qualifiedopinion.privatevault.SafBenchmarkTest
            --no-daemon --console=plain

      - name: Check minified app and test references
        run: scripts/check-releasecheck-refs.sh

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
